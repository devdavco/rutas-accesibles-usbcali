<div class="controles">
  <div class="zoom" role="group" aria-label="Acercamiento del mapa">
    <button type="button" class="boton-mapa" (click)="acercar()">Acercar</button>
    <button type="button" class="boton-mapa" (click)="alejar()">Alejar</button>
  </div>
  <button type="button" class="boton-mapa" [attr.aria-pressed]="soloPlano()" (click)="alternarSoloPlano()">
    Solo plano
  </button>
</div>
