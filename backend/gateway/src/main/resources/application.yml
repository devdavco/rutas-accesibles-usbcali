server:
  port: 8080
  # El cliente HTTP del gateway descomprime lo que recibe de los servicios, así que la
  # compresión gzip hacia el navegador se aplica de nuevo aquí
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Administración de puntos y tramos
            - id: servicio-negocio
              uri: ${NEGOCIO_URL:http://localhost:8081}
              predicates:
                - Path=/api/admin/**
            # Cálculo de rutas accesibles
            - id: servicio-grafos
              uri: ${GRAFOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/rutas/**

rutas:
  cors:
    # Orígenes del frontend separados por comas (en desarrollo, el servidor de Angular)
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
