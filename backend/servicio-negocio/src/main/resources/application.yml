server:
  port: 8081

spring:
  application:
    name: servicio-negocio
  # Conexión a PostgreSQL/PostGIS: las credenciales llegan solo por variables de entorno
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rutas}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
