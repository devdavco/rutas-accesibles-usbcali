server:
  port: 8081

spring:
  application:
    name: servicio-negocio
  # Conexión a PostgreSQL/PostGIS: las credenciales llegan solo por variables de entorno
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rutas}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

rutas:
  jwt:
    # Clave HS256 (mínimo 256 bits = 32 bytes). Sin valor por defecto: el servicio no arranca sin ella
    secreto: ${JWT_SECRETO}
    expiracion: PT2H
  # Administrador inicial: se crea al arrancar si no existe (no hay endpoint de registro)
  admin:
    correo: ${ADMIN_CORREO:}
    contrasena: ${ADMIN_CONTRASENA:}

management:
  endpoints:
    web:
      exposure:
        include: health
